# Prebuilt macOS binaries on a version tag (v*), modelled on biomarker-cli's
# release.yml.
#
# Standing rule (hx-rx3.25): no cargo build on carbon, and the build boxes
# are Linux, so the macOS binary carbon runs comes from here. Only the two
# macOS targets are built: this repo is private, so macOS runner minutes are
# billed (see docs/release.md before adding targets). x86_64 needs nightly
# for fsqlite 0.4; Apple Silicon builds on stable (see rust-toolchain.toml).
# Assets per target:
#   health-cli-<tag>-<target>.tar.gz + .sha256
# plus one SHA256SUMS covering every archive. Each archive holds every binary
# in the package (health, supplement-index), README.md and LICENSE.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.0"
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}
  BINS: health supplement-index

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            toolchain: stable
          # GitHub retired the macos-13 image in December 2025; macos-15-intel
          # is the remaining x86_64 macOS runner.
          - target: x86_64-apple-darwin
            os: macos-15-intel
            toolchain: nightly
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Tag matches Cargo.toml version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          if [[ "$TAG" != "v$version" ]]; then
            echo "::error::tag $TAG does not match Cargo.toml version $version"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - run: cargo build --release --locked --bins --target ${{ matrix.target }}
      - name: Smoke test
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/health"
          "$bin" --version
          export HEALTH_DB="$RUNNER_TEMP/smoke.db" HEALTH_KEY_SOURCE=env HEALTH_KEY=release-smoke-passphrase
          "$bin" db init
          "$bin" doctor
      - name: Package
        shell: bash
        run: |
          name="health-cli-$TAG-${{ matrix.target }}"
          mkdir "$name"
          cp README.md LICENSE "$name/"
          for b in $BINS; do
            cp "target/${{ matrix.target }}/release/$b" "$name/"
          done
          tar -czf "$name.tar.gz" "$name"
          archive="$name.tar.gz"
          shasum -a 256 "$archive" >"$archive.sha256"
          cat "$archive.sha256"
          echo "ARCHIVE=$archive" >>"$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: cat *.sha256 | sort -k2 >SHA256SUMS && cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --generate-notes --verify-tag --repo "$GITHUB_REPOSITORY"
          fi
