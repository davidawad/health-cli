[package]
name = "health-cli"
version = "0.1.0"
edition = "2021"
description = "Source of truth for non-lab personal health data (supplements, products, nutrition, routines...), backed by FrankenSQLite (fsqlite); generates the Health Dashboard workbook"
license = "MIT"
readme = "README.md"
default-run = "health"

[[bin]]
name = "health"
path = "src/main.rs"

[lib]
name = "health_cli"
path = "src/lib.rs"

[dependencies]
fsqlite = { version = "0.4.7", default-features = false, features = ["native"] }
asupersync = { version = "0.5", default-features = false }
clap = { version = "4.5", features = ["derive", "env", "wrap_help", "string"] }
clap_complete = "4.5"
clap_complete_nushell = "4.5"
clap_mangen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
csv = "1.3"
toon-format = { version = "0.5", default-features = false }
yaml_serde = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
chacha20poly1305 = "0.11"
argon2 = "0.6"
zeroize = { version = "1", features = ["derive"] }
getrandom = "0.4"
rpassword = "7"
age = { version = "0.12", features = ["armor", "ssh"] }
sha2 = "0.10"
base64 = "0.22"
calamine = "0.36.1"
rust_xlsxwriter = { version = "0.99.1", features = ["chrono"] }
directories = "6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
ssh-key = { version = "0.6", features = ["ed25519", "encryption", "getrandom"] }
rand_core = { version = "0.6", features = ["getrandom"] }
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[profile.dev.package."*"]
opt-level = 1

[profile.release]
strip = "symbols"
